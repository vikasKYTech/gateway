server:
  port: 9094

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: GATEWAY

  cloud:
    gateway:
      routes:
        - id: HOTEL-SERVICE
          uri: lb://hotelManagement
          predicates:
            - Path=/hotel,/hotel/**

        - id: RATING-SERVICE
          uri: lb://RATING-SERVICE
          predicates:
            - Path=/rating,/rating/**

        - id: USER-SERVICE
          uri: lb://userManagement
          predicates:
            - Path=/user,/user/**

eureka:
  instance:
    appname: GATEWAY
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

